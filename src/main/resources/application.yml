spring:
  config:
    import: "optional:file:./.env[.properties]"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/dhc}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE

notification:
  rabbitmq:
    exchange: ${NOTIFICATION_EXCHANGE:}
    routing-key: ${NOTIFICATION_ROUTING_KEY:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

admin:
  accounts:
    admin01:
      username: ${ADMIN01_USERNAME}
      password: ${ADMIN01_PASSWORD}
    admin02:
      username: ${ADMIN02_USERNAME}
      password: ${ADMIN02_PASSWORD}
    admin03:
      username: ${ADMIN03_USERNAME}
      password: ${ADMIN03_PASSWORD}
    admin04:
      username: ${ADMIN04_USERNAME}
      password: ${ADMIN04_PASSWORD}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

