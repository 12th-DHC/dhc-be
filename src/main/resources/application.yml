spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dhc
    username: root
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

admin:
  account:
    admin01:
      username: ${ADMIN01_USERNAME}
      password: ${ADMIN01_PASSWORD}
    admin02:
      username: ${ADMIN02_USERNAME}
      password: ${ADMIN02_PASSWORD}
    admin03:
      username: ${ADMIN03_USERNAME}
      password: ${ADMIN03_PASSWORD}
    admin04:
      username: ${ADMIN04_USERNAME}
      password: ${ADMIN04_PASSWORD}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

